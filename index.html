<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小鱼·造物</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #FF8A65 0%, #F48FB1 35%, #CE93D8 65%, #4FC3F7 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 24px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%; top: -100px; right: -100px;
    animation: float1 18s ease-in-out infinite;
  }
  body::after {
    content: '';
    position: absolute;
    width: 250px; height: 250px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%; bottom: -80px; left: -80px;
    animation: float2 22s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-30px, 40px) scale(1.1); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -30px) scale(1.08); }
  }

  .card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 40px 32px 32px;
    width: 100%; max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    position: relative; z-index: 1; text-align: center;
    animation: cardIn 0.95s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo {
    width: 100px; height: 100px;
    margin: 0 auto 20px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(244,143,177,0.35);
    animation: logoIn 0.85s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .logo:active {
    transform: scale(0.92);
    box-shadow: 0 4px 12px rgba(244,143,177,0.3);
  }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.5) rotate(-8deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }
  .logo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .title {
    font-size: 28px; font-weight: 700; color: #1a1a1a;
    margin-bottom: 8px; letter-spacing: 1px;
    animation: fadeUp 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.4s both;
  }
  .subtitle {
    font-size: 15px; color: #888; margin-bottom: 28px;
    animation: fadeUp 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.55s both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .url-box {
    background: #f5f5f7; border-radius: 12px; padding: 14px 16px;
    margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    animation: fadeUp 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.7s both;
    transition: background 0.2s ease;
  }
  .url-text {
    font-size: 13px; color: #555; word-break: break-all; text-align: left;
    flex: 1; font-family: monospace;
  }
  .copy-btn-small {
    background: #FF6B6B; color: white; border: none; padding: 8px 14px;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                background 0.2s ease,
                box-shadow 0.2s ease;
  }
  .copy-btn-small:hover { background: #ff5252; box-shadow: 0 4px 12px rgba(255,107,107,0.3); }
  .copy-btn-small:active { transform: scale(0.9); }

  .btn-group {
    display: flex; flex-direction: column; gap: 12px;
    animation: fadeUp 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.85s both;
  }
  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    font-size: 17px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, #FF8A65, #F48FB1);
    color: white; box-shadow: 0 6px 20px rgba(244,143,177,0.4);
  }
  .btn-primary:hover { box-shadow: 0 10px 30px rgba(244,143,177,0.5); }
  .btn-primary:active { box-shadow: 0 3px 10px rgba(244,143,177,0.3); }
  .btn-secondary { background: #1a1a1a; color: white; box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
  .btn-secondary:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
  .btn-icon {
    font-size: 20px;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn-primary:hover .btn-icon { transform: translateX(3px) scale(1.1); }
  .btn-secondary:hover .btn-icon { transform: scale(1.15); }

  .tip {
    margin-top: 24px; font-size: 13px; color: #999; line-height: 1.8;
    text-align: center;
    animation: fadeUp 0.7s cubic-bezier(0.4, 0, 0.2, 1) 1.05s both;
  }
  .tip strong {
    color: #666;
    display: block;
    margin-bottom: 6px;
    font-size: 16px;
    font-weight: 600;
  }
  .tip-text {
    transform: translate(3px, -4px);
  }

  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.8); color: white; padding: 16px 28px;
    border-radius: 12px; font-size: 15px; z-index: 999;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
